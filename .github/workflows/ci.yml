name: CI

# `zig build ci` is the single gate: format check, unit tests and the
# freestanding target compiles. It is the same command contributors run
# locally, so a green local run and a green CI run mean the same thing.
#
# The Zig version is pinned deliberately. Breeze depends on comptime behaviour
# that has moved between Zig releases - `@typeInfo` field shapes,
# `std.builtin.Type` variants, `std.fs` entry points, the removal of
# `std.io` - so an unpinned toolchain would turn a routine runner update into
# an unexplained red build. The pin must match `minimum_zig_version` in
# `build.zig.zon`; `.zigversion` carries the same value for the tooling that
# reads it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: zig build ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read the pinned Zig version
        id: zigver
        run: echo "version=$(cat .zigversion)" >> "$GITHUB_OUTPUT"

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.zigver.outputs.version }}

      - name: Report the toolchain
        run: zig version

      - name: Format check, unit tests and target compiles
        run: zig build ci

      # The target list is a release claim in README.md ("7 targets"), so the
      # job prints it and asserts the size. A silently shrinking list is how a
      # target quietly stops being verified. The count is stable across cached
      # and uncached runs: the summary names each object either way.
      #
      # The `^+- ` anchor matters. Each object is also installed so that the
      # binary is actually emitted (`-fno-emit-bin` would otherwise stop the
      # compile after semantic analysis), and the summary repeats the compile
      # line under its install step. Without the anchor this counts 14.
      - name: Confirm every target was compiled
        run: |
          out=$(zig build check-targets --summary all 2>&1)
          echo "$out"
          count=$(printf '%s\n' "$out" | grep -c '^+- compile obj breeze_fw_')
          echo "compiled $count firmware objects"
          test "$count" -eq 7

      # The numbers in README's status line drifted three separate times before
      # anyone noticed (59/6, then 68/7 after new tests). Documentation that
      # restates a measurement goes stale silently, so the claim is checked rather
      # than trusted. ARCHITECTURE.md and FUSION.md deliberately no longer repeat
      # these numbers; README is the single source.
      #
      # The three suites are separate on purpose: the kernel's own tests; the
      # example application's, which run on the host because its modules take their
      # I/O surface as a comptime parameter; and the algorithm layer's, which import
      # neither. The target count is the fourth number on that line.
      #
      # This lives in a script rather than here because of how it first failed: a
      # round added four algorithm tests and forgot the README line, and the only
      # thing that noticed was this job - one push later. `tools/counts.ps1` runs
      # the same four comparisons by hand.
      - name: README's counts must match reality
        run: pwsh -NoProfile -File tools/counts.ps1

      # The cost table is a measurement, and measurements rot: it had drifted in
      # three separate documents before anyone noticed, twice because the kernel
      # changed and once because the measuring tool itself under-reported RAM.
      # The script rebuilds the three images with the flags docs/ARCHITECTURE.md
      # documents, measures them with tools/elfsize.ps1, and compares each row.
      - name: README's cost table must match the images
        run: pwsh -NoProfile -File tools/sizes.ps1

