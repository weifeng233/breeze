name: CI

# `zig build ci` is the single gate: format check, unit tests and the
# freestanding target compiles. It is the same command contributors run
# locally, so a green local run and a green CI run mean the same thing.
#
# The Zig version is pinned deliberately. Breeze depends on comptime behaviour
# that has moved between Zig releases - `@typeInfo` field shapes,
# `std.builtin.Type` variants, `std.fs` entry points, the removal of
# `std.io` - so an unpinned toolchain would turn a routine runner update into
# an unexplained red build. The pin must match `minimum_zig_version` in
# `build.zig.zon`; `.zigversion` carries the same value for the tooling that
# reads it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: zig build ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read the pinned Zig version
        id: zigver
        run: echo "version=$(cat .zigversion)" >> "$GITHUB_OUTPUT"

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.zigver.outputs.version }}

      - name: Report the toolchain
        run: zig version

      - name: Format check, unit tests and target compiles
        run: zig build ci

      # The target list is a release claim in README.md ("7 targets"), so the
      # job prints it and asserts the size. A silently shrinking list is how a
      # target quietly stops being verified. The count is stable across cached
      # and uncached runs: the summary names each object either way.
      #
      # The `^+- ` anchor matters. Each object is also installed so that the
      # binary is actually emitted (`-fno-emit-bin` would otherwise stop the
      # compile after semantic analysis), and the summary repeats the compile
      # line under its install step. Without the anchor this counts 14.
      - name: Confirm every target was compiled
        run: |
          out=$(zig build check-targets --summary all 2>&1)
          echo "$out"
          count=$(printf '%s\n' "$out" | grep -c '^+- compile obj breeze_fw_')
          echo "compiled $count firmware objects"
          test "$count" -eq 7

      # The numbers in README's status line drifted three separate times before
      # anyone noticed (59/6, then 68/7 after new tests). Documentation that
      # restates a measurement goes stale silently, so the claim is checked
      # rather than trusted. ARCHITECTURE.md and FUSION.md deliberately no
      # longer repeat these numbers; README is the single source.
      #
      # Three suites now: the kernel's own tests; the example application's,
      # which run on the host because its modules take their I/O surface as a
      # comptime parameter; and the algorithm layer's, which are neither (nothing
      # under src/math/ imports the kernel, so calling them kernel tests would
      # change what that number means). Each count is claimed separately, so
      # adding a test to any one of them fails here until README is updated.
      - name: README's test counts must match reality
        run: |
          kernel=$(zig test src/breeze.zig 2>&1 | sed -n 's/^All \([0-9]*\) tests passed\.$/\1/p')
          app=$(zig test --dep breeze -Mroot=examples/smartcar/app_test.zig -Mbreeze=src/breeze.zig 2>&1 | sed -n 's/^All \([0-9]*\) tests passed\.$/\1/p')
          math=$(zig test src/math/math.zig 2>&1 | sed -n 's/^All \([0-9]*\) tests passed\.$/\1/p')
          claimed_kernel=$(grep -o '\*\*[0-9]* 个内核单元测试\*\*' README.md | head -1 | grep -o '[0-9]*')
          claimed_app=$(grep -o '\*\*[0-9]* 个应用测试\*\*' README.md | head -1 | grep -o '[0-9]*')
          claimed_math=$(grep -o '\*\*[0-9]* 个算法测试\*\*' README.md | head -1 | grep -o '[0-9]*')
          echo "kernel: claimed=$claimed_kernel actual=$kernel"
          echo "app:    claimed=$claimed_app actual=$app"
          echo "math:   claimed=$claimed_math actual=$math"
          test -n "$kernel" || { echo "could not parse the kernel test count"; exit 1; }
          test -n "$app" || { echo "could not parse the app test count"; exit 1; }
          test -n "$math" || { echo "could not parse the algorithm test count"; exit 1; }
          test -n "$claimed_kernel" || { echo "could not parse README's kernel claim"; exit 1; }
          test -n "$claimed_app" || { echo "could not parse README's app claim"; exit 1; }
          test -n "$claimed_math" || { echo "could not parse README's algorithm claim"; exit 1; }
          test "$kernel" = "$claimed_kernel"
          test "$app" = "$claimed_app"
          test "$math" = "$claimed_math"

      - name: README's target count must match reality
        run: |
          actual=$(zig build check-targets --summary all 2>&1 | grep -c '^+- compile obj breeze_fw_')
          claimed=$(grep -o '\*\*[0-9]* 个目标交叉编译\*\*' README.md | head -1 | grep -o '[0-9]*')
          echo "README claims: $claimed   actual: $actual"
          test -n "$claimed" || { echo "could not parse README's claim"; exit 1; }
          test "$actual" = "$claimed"

      # The cost table is a measurement, and measurements rot: it had drifted in
      # three separate documents before anyone noticed, twice because the kernel
      # changed and once because the measuring tool itself under-reported RAM.
      # The script rebuilds the three images with the flags docs/ARCHITECTURE.md
      # documents, measures them with tools/elfsize.ps1, and compares each row.
      - name: README's cost table must match the images
        run: pwsh -NoProfile -File tools/sizes.ps1

      # The C algorithm layer is not part of `zig build ci` - it is C, and the
      # Zig build never touches it - so nothing looked at it, and it had rotted
      # to the point where any file that included `breeze/breeze.h` failed to
      # compile. Seven headers also called malloc/free/fabsf/sqrtf/expf without
      # including <stdlib.h>/<math.h>; on a 64-bit host an implicitly declared
      # malloc returns `int` and truncates the pointer, so those files compiled
      # and then computed the wrong answer.
      #
      # tools/check-c.ps1 discovers the files instead of listing them, compiles
      # every header standalone under -Werror, compiles every translation unit,
      # links and runs every example and application (the two applications are
      # interactive, so `q` is fed in under a timeout), runs the comm test suite,
      # and compares all four counts with README.md.
      - name: C layer must compile, link and run
        run: pwsh -NoProfile -File tools/check-c.ps1

